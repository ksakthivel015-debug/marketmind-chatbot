<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketMind</title>
<style>
  :root {
    --paper: #180f22;
    --card: #221733;
    --ink: #f5edff;
    --muted: #a999c9;
    --line: #382a52;
    --bubble: #2b1f42;
    --input: #180f22;
    --a1: #ec4899;
    --a2: #f59e0b;
    --glow1: rgba(236, 72, 153, 0.22);
    --glow2: rgba(245, 158, 11, 0.14);
    --dot: rgba(169, 153, 201, 0.12);
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    --err: #ff9aa8;
    --hdr: linear-gradient(135deg, #be185d, #ec4899);
    --head: "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 12% 18%, var(--glow1) 0, transparent 38%),
      radial-gradient(circle at 88% 82%, var(--glow2) 0, transparent 40%),
      radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: auto, auto, 22px 22px;
  }

  .app {
    width: 100%;
    max-width: 820px;
    height: calc(100dvh - 40px);
    max-height: 860px;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    background: var(--hdr);
    color: #fff;
    position: relative;
  }

  header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 10px;
    background: radial-gradient(circle at 10px -2px, transparent 8px, var(--card) 9px) repeat-x;
    background-size: 20px 10px;
  }

  .logo {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    font-size: 26px;
    background: rgba(255, 255, 255, 0.22);
    border: 2px dashed rgba(255, 255, 255, 0.7);
    border-radius: 50%;
  }

  .title h1 {
    font-family: var(--head);
    font-size: 22px;
    letter-spacing: 0.3px;
  }

  .title p {
    font-size: 13px;
    opacity: 0.92;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .title p::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b6f2a6;
    box-shadow: 0 0 0 3px rgba(182, 242, 166, 0.35);
  }

  .clear {
    margin-left: auto;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.55);
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .clear:hover { background: rgba(255, 255, 255, 0.35); }

  .chat-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  .chat {
    height: 100%;
    overflow-y: auto;
    padding: 26px 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .welcome {
    text-align: center;
    padding: 10px 10px 4px;
  }

  .welcome .emoji { font-size: 44px; }

  .welcome h2 {
    font-family: var(--head);
    font-size: 24px;
    margin: 6px 0;
  }

  .welcome p { color: var(--muted); font-size: 14px; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }

  .chip {
    background: var(--bubble);
    border: 1.5px solid var(--line);
    color: var(--ink);
    padding: 9px 15px;
    border-radius: 999px;
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s, background 0.2s;
  }

  .chip:hover {
    transform: translateY(-2px);
    border-color: var(--a1);
    background: color-mix(in srgb, var(--a1) 12%, var(--card));
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: rise 0.3s ease;
  }

  .row.user { flex-direction: row-reverse; }

  .avatar {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    font-size: 17px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--a2) 20%, var(--card));
    border: 1px solid var(--line);
  }

  .row.user .avatar { background: color-mix(in srgb, var(--a1) 20%, var(--card)); }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.6;
    border-radius: 20px;
    overflow-wrap: anywhere;
  }

  .row.bot .bubble {
    background: var(--bubble);
    border: 1px solid var(--line);
    border-left: 4px solid var(--a2);
    border-bottom-left-radius: 6px;
  }

  .row.user .bubble {
    background: linear-gradient(135deg, var(--a1), color-mix(in srgb, var(--a1) 75%, #000));
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .row.error .bubble {
    border-left-color: var(--err);
    color: var(--err);
    background: color-mix(in srgb, var(--err) 10%, var(--card));
  }

  .bubble p + p,
  .bubble p + ul,
  .bubble p + ol,
  .bubble ul + p,
  .bubble ol + p { margin-top: 8px; }

  .bubble ul, .bubble ol { padding-left: 22px; margin: 4px 0; }
  .bubble li { margin: 3px 0; }
  .bubble li::marker { color: var(--a1); font-weight: bold; }

  .bubble h4 {
    font-family: var(--head);
    font-size: 16px;
    color: var(--a1);
    margin: 10px 0 4px;
  }

  .bubble code {
    background: color-mix(in srgb, var(--a2) 20%, var(--card));
    padding: 1px 6px;
    border-radius: 6px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px;
  }

  .bubble pre {
    margin: 8px 0;
    padding: 12px 14px;
    background: #12151c;
    border-radius: 12px;
    overflow-x: auto;
  }

  .bubble pre code {
    display: block;
    padding: 0;
    background: none;
    color: #e6e9f0;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 4px 2px;
  }

  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--a2);
    animation: bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; background: var(--a1); }
  .typing span:nth-child(3) { animation-delay: 0.3s; background: var(--muted); }

  .scroll-btn {
    position: absolute;
    right: 22px;
    bottom: 14px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--a1);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    opacity: 0;
    transform: translateY(12px) scale(0.9);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s, filter 0.2s;
  }

  .scroll-btn.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .scroll-btn:hover { filter: brightness(1.12); }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 18px 18px;
    border-top: 1px dashed var(--line);
    background: var(--card);
  }

  textarea {
    flex: 1;
    resize: none;
    max-height: 130px;
    padding: 13px 18px;
    font: inherit;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--input);
    border: 1.5px solid var(--line);
    border-radius: 24px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  textarea::placeholder { color: var(--muted); }

  textarea:focus {
    border-color: var(--a1);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--a1) 22%, transparent);
  }

  .send {
    flex: none;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--hdr);
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }

  .send:hover:not(:disabled) { transform: scale(1.07) rotate(-6deg); }
  .send:disabled { opacity: 0.5; cursor: not-allowed; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  @media (max-width: 600px) {
    body { padding: 0; }
    .app { height: 100dvh; max-height: none; border-radius: 0; border: none; }
    .bubble { max-width: 86%; }
    .title p { display: none; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">📣</div>
      <div class="title">
        <h1>MarketMind</h1>
        <p>Your digital marketing mentor</p>
      </div>
      <button class="clear" id="clearBtn" type="button">New chat</button>
    </header>

    <div class="chat-wrap">
      <div class="chat" id="chat"></div>
      <button class="scroll-btn" id="scrollBtn" type="button" aria-label="Scroll to latest message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <form class="composer" id="form" autocomplete="off">
      <textarea id="input" rows="1" maxlength="1500" placeholder="Ask a digital marketing question..."></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </form>
  </main>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const scrollBtn = document.getElementById("scrollBtn");
  const clearBtn = document.getElementById("clearBtn");

  const BOT_AVATAR = "📣";
  const USER_AVATAR = "🎓";
  const suggestions = ["Explain SEO vs SEM", "What is a marketing funnel?", "How does email marketing work?", "Explain social media KPIs", "What is content marketing?"];

  let history = [];
  let loading = false;

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/`(.+?)`/g, "<code>$1</code>");
  }

  function renderMarkdown(text) {
    let html = "";
    let list = null;
    let code = null;

    const closeList = () => {
      if (list) {
        html += `</${list}>`;
        list = null;
      }
    };

    const closeCode = () => {
      html += `<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`;
      code = null;
    };

    for (const raw of text.split("\n")) {
      const line = raw.trim();
      let match;

      if (line.startsWith("```")) {
        if (code === null) {
          closeList();
          code = [];
        } else {
          closeCode();
        }
      } else if (code !== null) {
        code.push(raw);
      } else if (!line) {
        closeList();
      } else if ((match = line.match(/^#{1,4}\s+(.*)/))) {
        closeList();
        html += `<h4>${inline(match[1])}</h4>`;
      } else if ((match = line.match(/^[-*•]\s+(.*)/))) {
        if (list !== "ul") {
          closeList();
          html += "<ul>";
          list = "ul";
        }
        html += `<li>${inline(match[1])}</li>`;
      } else if ((match = line.match(/^\d+[.)]\s+(.*)/))) {
        if (list !== "ol") {
          closeList();
          html += "<ol>";
          list = "ol";
        }
        html += `<li>${inline(match[1])}</li>`;
      } else {
        closeList();
        html += `<p>${inline(line)}</p>`;
      }
    }

    if (code !== null) closeCode();
    closeList();
    return html;
  }

  function scrollToBottom(smooth = true) {
    chat.scrollTo({ top: chat.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  }

  function updateScrollButton() {
    const distance = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
    scrollBtn.classList.toggle("show", distance > 120);
  }

  function addMessage(role, content, isError = false) {
    const row = document.createElement("div");
    row.className = `row ${role}${isError ? " error" : ""}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? USER_AVATAR : BOT_AVATAR;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") {
      bubble.textContent = content;
    } else {
      bubble.innerHTML = renderMarkdown(content);
    }

    row.append(avatar, bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML =
      `<div class="avatar">${BOT_AVATAR}</div>` +
      '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showWelcome() {
    chat.innerHTML = "";

    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML =
      `<div class="emoji">${BOT_AVATAR}</div>` +
      "<h2>Let's grow your marketing skills!</h2>" +
      "<p>Ask me anything about digital marketing concepts.</p>";

    const chips = document.createElement("div");
    chips.className = "chips";
    suggestions.forEach((text) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = text;
      chip.addEventListener("click", () => sendMessage(text));
      chips.appendChild(chip);
    });

    welcome.appendChild(chips);
    chat.appendChild(welcome);
    updateScrollButton();
  }

  function setLoading(state) {
    loading = state;
    sendBtn.disabled = state;
    input.disabled = state;
    if (!state) input.focus();
  }

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
  }

  async function sendMessage(text) {
    const message = text.trim();
    if (!message || loading) return;

    const welcome = chat.querySelector(".welcome");
    if (welcome) welcome.remove();

    addMessage("user", message);
    input.value = "";
    resizeInput();
    setLoading(true);

    const typing = addTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      const data = await response.json();
      typing.remove();

      if (!response.ok) {
        addMessage("bot", data.error || "Something went wrong.", true);
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "user", text: message });
        history.push({ role: "model", text: data.reply });
      }
    } catch (error) {
      typing.remove();
      addMessage("bot", "Unable to reach the server. Please check your connection.", true);
    }

    setLoading(false);
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener("input", resizeInput);
  chat.addEventListener("scroll", updateScrollButton);
  scrollBtn.addEventListener("click", () => scrollToBottom());

  clearBtn.addEventListener("click", () => {
    if (loading) return;
    history = [];
    showWelcome();
  });

  showWelcome();
  input.focus();
</script>
</body>
</html>
